name: Publish Shared Space
on:
  push:
    branches: [main]
    paths:
      - 'shared-space/**'
      - '.github/workflows/shared-space-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: shared-space-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: shared-space
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
